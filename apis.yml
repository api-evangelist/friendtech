description: 'Friend.tech is a decentralized social application built on Base, Coinbase''s
  Ethereum layer-2 network, that lets users tokenize their social graph by buying and selling
  "keys" (originally "shares") which grant access to private chat rooms and gated content with
  individual creators. Launched in August 2023 and backed by Paradigm, a key''s price rose as
  more people bought into a given creator. In 2024 the team disabled protocol fees and
  relinquished control of the on-chain smart contracts to the community. Friend.tech operates a
  live web frontend (www.friend.tech) but publishes no public developer portal, API reference,
  SDK, or OpenAPI definition; this profile was surfaced as a Paradigm portfolio company and
  enriched with the real signals available (live-site domain security posture).'
